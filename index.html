<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的摄影作品集 | Photography Portfolio</title>
    <style>
        /* 全局重置与基础样式 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f9f9f9; color: #333; line-height: 1.6; }
        a { text-decoration: none; color: inherit; transition: all 0.3s ease; }
        
        /* 导航栏 */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 50px; background: rgba(255,255,255,0.9); 
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
        }
        .logo { font-size: 24px; font-weight: bold; letter-spacing: 2px; }
        .nav-links a { margin-left: 30px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .nav-links a:hover { color: #888; }

        /* 主视觉区 (Hero Section) */
        .hero {
            height: 80vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center;
            background: url('https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
            color: white; position: relative;
        }
        .hero::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4); /* 增加暗色遮罩让文字更清晰 */
        }
        .hero-content { position: relative; z-index: 1; }
        .hero h1 { font-size: 48px; margin-bottom: 15px; letter-spacing: 4px; }
        .hero p { font-size: 18px; margin-bottom: 30px; opacity: 0.9; }
        .btn {
            padding: 12px 30px; border: 1px solid #fff; color: #fff; 
            text-transform: uppercase; letter-spacing: 2px; font-size: 14px;
        }
        .btn:hover { background: #fff; color: #000; }

        /* 作品展示区 (模拟瀑布流) */
        .gallery-section { padding: 80px 50px; max-width: 1400px; margin: 0 auto; }
        .section-title { font-size: 28px; margin-bottom: 40px; text-align: center; letter-spacing: 2px; }
        .gallery-grid {
            columns: 3; column-gap: 20px;
        }
        .gallery-item {
            break-inside: avoid; margin-bottom: 20px; position: relative; overflow: hidden; cursor: pointer;
        }
        .gallery-item img { width: 100%; display: block; transition: transform 0.5s ease; }
        .gallery-item:hover img { transform: scale(1.05); }
        .overlay {
            position: absolute; bottom: 0; left: 0; right: 0; padding: 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.7)); color: #fff;
            transform: translateY(100%); transition: transform 0.3s ease;
        }
        .gallery-item:hover .overlay { transform: translateY(0); }
        .overlay h3 { font-size: 16px; margin-bottom: 5px; }
        .overlay p { font-size: 12px; opacity: 0.8; }

        /* 页脚 */
        footer {
            text-align: center; padding: 40px; background: #111; color: #888; 
            font-size: 14px; letter-spacing: 1px; margin-top: 50px;
        }

        /* 响应式适配 (手机端) */
        @media (max-width: 768px) {
            nav { padding: 15px 20px; }
            .hero h1 { font-size: 32px; }
            .gallery-section { padding: 40px 20px; }
            .gallery-grid { columns: 2; column-gap: 10px; }
        }
    </style>
</head>
<body>

    <!-- 导航栏 -->
    <nav>
        <div class="logo">PHOTOGRAPHY</div>
        <div class="nav-links">
            <a href="#gallery">作品</a>
            <a href="#about">关于</a>
            <a href="#contact">联系</a>
        </div>
    </nav>

    <!-- 主视觉区 -->
    <section class="hero">
        <div class="hero-content">
            <h1>捕捉光影的瞬间</h1>
            <p>用镜头记录世界，用影像讲述故事</p>
            <a href="#gallery" class="btn">探索作品集</a>
        </div>
    </section>

    <!-- 作品展示区 -->
    <section class="gallery-section" id="gallery">
        <h2 class="section-title">精选作品</h2>
        <div class="gallery-grid">
            <!-- 图片1 -->
            <div class="gallery-item">
                <img src="A%20Thousand%20Towers.jpg" alt="千塔之城">
                <div class="overlay">
                    <h3><img src="my-photo.jpg" alt="我的摄影作品"></h3>
                    <p>2026 · 新疆</p>
                </div>
            </div>
            <!-- 图片2 -->
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=800&q=80" alt="晨雾">
                <div class="overlay">
                    <h3>晨雾</h3>
                    <p>2023 · 风光摄影</p>
                </div>
            </div>
            <!-- 图片3 -->
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80" alt="树林">
                <div class="overlay">
                    <h3>光之隙</h3>
                    <p>2022 · 自然纪实</p>
                </div>
            </div>
            <!-- 图片4 -->
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1518173946687-a1e0e2a9eec3?auto=format&fit=crop&w=800&q=80" alt="星空">
                <div class="overlay">
                    <h3>星河璀璨</h3>
                    <p>2022 · 天文摄影</p>
                </div>
            </div>
            <!-- 图片5 -->
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="海滩">
                <div class="overlay">
                    <h3>海岸线</h3>
                    <p>2021 · 旅行纪实</p>
                </div>
            </div>
            <!-- 图片6 -->
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?auto=format&fit=crop&w=800&q=80" alt="花朵">
                <div class="overlay">
                    <h3>微观世界</h3>
                    <p>2021 · 微距摄影</p>
                </div>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer id="contact">
        <p>&copy; 2024 你的名字 | 邮箱: your@email.com | 社交媒体链接</p>
    </footer>

</body>
</html>
