<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T. J. ART | Photography Portfolio</title>
    <style>
        /* --- 1. 全局纯黑沉浸式风格 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #000; color: #e0e0e0; line-height: 1.6;
            overflow-x: hidden; 
        }
        a { text-decoration: none; color: inherit; transition: opacity 0.3s ease; }
        a:hover { opacity: 0.7; }

        /* --- 2. 顶部信息栏 --- */
   /* --- 2. 顶部信息栏 (透明且叠加在图片上) --- */
nav {
    display: flex; justify-content: space-between; align-items: center;
    padding: 25px 50px;
    background-color: transparent; /* 保持透明 */
    position: absolute; /* 改为绝对定位，直接浮在图片上方 */
    top: 0; left: 0; right: 0; /* 铺满屏幕顶部 */
    z-index: 100; /* 确保在最上层 */
}
.logo { 
    font-size: 20px; /* 恢复原本大小 */
    font-weight: 600; 
    letter-spacing: 4px; 
    color: #fff; /* 强制白色 */
    text-transform: uppercase;
}
.nav-links a { 
    margin-left: 40px; 
    font-size: 13px; /* 恢复原本大小 */
    text-transform: uppercase; 
    letter-spacing: 2px; 
    color: #fff; /* 强制白色，确保在图片上清晰可见 */
    transition: opacity 0.3s ease;
}
.nav-links a:hover { color: #fff; opacity: 0.7; }
        

        /* --- 3. 全屏幻灯片 (Slideshow) --- */
        .hero-slideshow {
            position: relative; width: 100%; height: 85vh; overflow: hidden; background: #000;
        }
        .slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; /* 默认隐藏 */
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1); /* 核心：加减速平滑过渡 */
            display: flex; align-items: flex-end; justify-content: center;
        }
        .slide.active { opacity: 1; } /* 激活状态显示 */
        
        .slide img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; display: block;
        }
        .slide::before { /* 底部渐变遮罩，让文字更清晰 */
            content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 40%;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); z-index: 1;
        }
        .slide-caption {
            position: relative; z-index: 2; padding: 40px; text-align: center; color: #fff;
            transform: translateY(20px); opacity: 0; transition: all 1s ease 0.5s; /* 文字延迟淡入 */
        }
        .slide.active .slide-caption { transform: translateY(0); opacity: 1; }
        
        .slide-caption h3 { font-size: 28px; font-weight: 300; letter-spacing: 3px; margin-bottom: 8px; }
        .slide-caption p { font-size: 14px; opacity: 0.8; letter-spacing: 2px; text-transform: uppercase; }

        /* --- 4. 作品网格与放大功能 --- */
        .gallery-section { padding: 100px 50px; max-width: 1600px; margin: 0 auto; }
        .section-title { font-size: 14px; margin-bottom: 50px; text-align: center; letter-spacing: 4px; color: #666; text-transform: uppercase; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 15px; }
        .gallery-item { position: relative; overflow: hidden; cursor: pointer; background-color: #111; aspect-ratio: 3/2; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease, filter 0.6s ease; filter: brightness(0.9); }
        .gallery-item:hover img { transform: scale(1.08); filter: brightness(1.1); }
        .overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 25px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); transform: translateY(100%); transition: transform 0.4s ease; }
        .gallery-item:hover .overlay { transform: translateY(0); }
        .overlay h3 { font-size: 18px; color: #fff; margin-bottom: 5px; font-weight: 400; letter-spacing: 1px; }
        .overlay p { font-size: 12px; opacity: 0.6; text-transform: uppercase; letter-spacing: 1px; }

        /* --- 5. 图片放大预览 (Lightbox) --- */
        .lightbox { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.98); justify-content: center; align-items: center; cursor: zoom-out; }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 90%; max-height: 90vh; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        .close-btn { position: absolute; top: 30px; right: 40px; color: #fff; font-size: 30px; cursor: pointer; font-weight: 200; letter-spacing: 2px; }

        /* --- 6. 页脚 --- */
        footer { text-align: center; padding: 50px; background: #000; color: #444; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; border-top: 1px solid #1a1a1a; }

        /* --- 7. 手机端适配 --- */
        @media (max-width: 768px) {
            nav { padding: 20px 25px; }
            .logo { font-size: 16px; letter-spacing: 2px; }
            .nav-links a { margin-left: 20px; font-size: 11px; }
            .hero-slideshow { height: 60vh; }
            .slide-caption h3 { font-size: 20px; }
            .gallery-section { padding: 60px 20px; }
            .gallery-grid { grid-template-columns: 1fr; gap: 10px; }
        }
    </style>
</head>
<body>

    <!-- 顶部信息栏 -->
    <nav>
        <div class="logo">T. J. ART</div>
        <div class="nav-links">
            <a href="about.html">ABOUT</a>
        </div>
    </nav>

       <!-- 全屏幻灯片展览 -->
    <div class="hero-slideshow">
        <!-- 幻灯片 1 -->
        <div class="slide active">
            <img src="1Wilderness.jpg" alt="作品1">
            <div class="slide-caption">
                <h3>Wilderness</h3>
                <p>内蒙 · 2022</p>
            </div>
        </div>
        <!-- 幻灯片 2 -->
        <div class="slide">
            <img src="2AThousandTowers.jpg" alt="作品2">
            <div class="slide-caption">
                <h3>千塔之城</h3>
                <p>新疆 · 2026</p>
            </div>
        </div>
        <!-- 幻灯片 3 -->
        <div class="slide">
            <img src="3AWorldofWhite.jpg" alt="作品3">
            <div class="slide-caption">
                <h3>A World of White</h3>
                <p>新疆 · 2026</p>
            </div>
        </div>
    </div>

    <!-- 作品网格 -->
    <section class="gallery-section">
        <h2 class="section-title">Selected Works</h2>
        <div class="gallery-grid">
            <div class="gallery-item" onclick="openLightbox(this)">
                <img src="AThousandTowers.jpg" alt="千塔之城">
                <div class="overlay"><h3>A Thousand Towers</h3><p>Urban Landscape</p></div>
            </div>
            <div class="gallery-item" onclick="openLightbox(this)">
                <img src="your-photo-2.jpg" alt="作品标题">
                <div class="overlay"><h3>Silent Valley</h3><p>Nature</p></div>
            </div>
            <div class="gallery-item" onclick="openLightbox(this)">
                <img src="your-photo-3.jpg" alt="作品标题">
                <div class="overlay"><h3>Neon Nights</h3><p>Street</p></div>
            </div>
            <div class="gallery-item" onclick="openLightbox(this)">
                <img src="your-photo-4.jpg" alt="作品标题">
                <div class="overlay"><h3>Morning Mist</h3><p>Landscape</p></div>
            </div>
        </div>
    </section>

    <!-- 放大预览框 -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="close-btn">CLOSE</span>
        <img id="lightbox-img" src="" alt="Preview">
    </div>

    <footer>&copy; 2024 T. J. ART. All Rights Reserved.</footer>

    <script>
        // --- 1. 全屏幻灯片逻辑 (加减速 + 停留5秒) ---
        const slides = document.querySelectorAll('.slide');
        let currentSlide = 0;
        const INTERVAL_TIME = 5000; // 停留

        function nextSlide() {
            // 移除当前激活状态
            slides[currentSlide].classList.remove('active');
            // 切换到下一张 (循环)
            currentSlide = (currentSlide + 1) % slides.length;
            // 添加激活状态 (触发CSS的加减速过渡)
            slides[currentSlide].classList.add('active');
        }

        // 每5秒切换一次
        setInterval(nextSlide, INTERVAL_TIME);

        // --- 2. 图片放大逻辑 ---
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        function openLightbox(element) {
            const img = element.querySelector('img');
            lightboxImg.src = img.src;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // 按 ESC 键关闭
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });
    </script>
</body>
</html>
