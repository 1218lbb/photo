<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摄影作品画廊</title>
    <style>
        /* --- 1. 全局基础样式 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #0a0a0a; 
            color: #e0e0e0; 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            line-height: 1.6; 
            padding: 40px 20px;
        }
        
        /* --- 2. 头部信息 --- */
        header { 
            text-align: center; 
            margin-bottom: 60px; 
            max-width: 800px; 
            margin-left: auto; 
            margin-right: auto; 
        }
        h1 { 
            font-size: 2.5rem; 
            letter-spacing: 2px; 
            margin-bottom: 15px; 
            color: #ffffff; 
            font-weight: 300; 
        }
        .subtitle { 
            font-size: 1rem; 
            color: #888; 
            letter-spacing: 1px; 
        }

        /* --- 3. 画廊网格 (Grid 布局) --- */
        .gallery-grid { 
            display: grid; 
            /* 核心：固定3列，自动填充 */
            grid-template-columns: repeat(3, 1fr); 
            gap: 15px; 
            max-width: 1600px; 
            margin: 0 auto; 
        }

        /* --- 4. 作品卡片 --- */
        .gallery-item { 
            position: relative; 
            overflow: hidden; 
            cursor: pointer; 
            background-color: #111; 
            border-radius: 2px;
            /* 默认高度由图片撑开 */
        }
        
        /* 核心：让超宽图占据两列 */
        .gallery-item.wide-span {
            grid-column: span 2;
        }

        .gallery-item img { 
            width: 100%; 
            height: 100%; 
            display: block; 
            object-fit: cover; 
            transition: transform 0.6s ease, filter 0.6s ease; 
            filter: brightness(0.9); 
        }
        
        .gallery-item:hover img { 
            transform: scale(1.05); 
            filter: brightness(1.1); 
        }

        /* --- 5. 放大预览 (Lightbox) --- */
        .lightbox { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background-color: rgba(0, 0, 0, 0.95); 
            z-index: 1000; 
            justify-content: center; 
            align-items: center; 
            flex-direction: column; 
            opacity: 0; 
            transition: opacity 0.3s ease; 
        }
        .lightbox.active { 
            display: flex; 
            opacity: 1; 
        }
        .lightbox img { 
            max-width: 90vw; 
            max-height: 85vh; 
            object-fit: contain; 
            box-shadow: 0 0 30px rgba(0,0,0,0.8); 
            border: 1px solid #333; 
        }
        .lightbox-close { 
            position: absolute; 
            top: 30px; right: 40px; 
            font-size: 3rem; 
            color: #fff; 
            cursor: pointer; 
            line-height: 1; 
            transition: color 0.3s; 
        }
        .lightbox-close:hover { color: #ff4d4d; }
        .lightbox-caption { 
            margin-top: 20px; 
            color: #aaa; 
            font-size: 0.9rem; 
            letter-spacing: 1px; 
        }

        /* --- 6. 响应式适配 --- */
        @media (max-width: 1024px) {
            .gallery-grid { grid-template-columns: repeat(2, 1fr); }
            /* 平板端如果图太宽，依然可以跨两列（即占满整行） */
        }
        @media (max-width: 600px) {
            .gallery-grid { grid-template-columns: 1fr; }
            .gallery-item.wide-span { grid-column: span 1; } /* 手机端取消跨列 */
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>光影·纪实</h1>
        <p class="subtitle">捕捉瞬间的永恒 · 每一帧都是故事</p>
    </header>

    <div class="gallery-grid" id="galleryGrid">
        <!-- 这里的图片将由 JavaScript 自动生成 -->
    </div>

    <!-- 放大预览层 -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" id="lightboxClose">&times;</span>
        <img src="" alt="预览大图" id="lightboxImg">
        <p class="lightbox-caption" id="lightboxCaption"></p>
    </div>

    <script>
        // ==========================================
        // ⚙️ 配置区：在这里添加你的图片链接和标题
        // ==========================================
        const photos = [
            { src: 'https://images.unsplash.com/photo-1493246507139-91e8fad9978e?w=1200&q=80', title: '山川湖海' },
            { src: 'https://images.unsplash.com/photo-1511497584788-876760111969?w=1200&q=80', title: '迷雾森林' },
            // 这是一个模拟的超宽幅图片 (比例 > 2:1)
            { src: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1600&q=80', title: '全景山脉 (超宽幅)' },
            { src: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1200&q=80', title: '约塞米蒂' },
            { src: 'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1200&q=80', title: '晨雾' },
            { src: 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1200&q=80', title: '林间小径' },
            // 另一个超宽幅示例
            { src: 'https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=1600&q=80', title: '广阔原野 (超宽幅)' },
            { src: 'https://images.unsplash.com/photo-1501854140801-50d01698950b?w=1200&q=80', title: '绿色星球' },
            { src: 'https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?w=1200&q=80', title: '秋日落叶' },
            { src: 'https://images.unsplash.com/photo-1475924156734-496f6cac6ec1?w=1200&q=80', title: '日落时分' },
            { src: 'https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=1200&q=80', title: '孤独的山峰' },
            { src: 'https://images.unsplash.com/photo-1426604966848-d7adac402bff?w=1200&q=80', title: '峡谷之光' }
        ];

        const galleryGrid = document.getElementById('galleryGrid');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxCaption = document.getElementById('lightboxCaption');
        const lightboxClose = document.getElementById('lightboxClose');

        // 1. 渲染画廊并自动识别超宽图
        photos.forEach(photo => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            
            const img = document.createElement('img');
            img.src = photo.src;
            img.alt = photo.title;
            img.loading = 'lazy'; // 懒加载提升性能
            
            // 核心逻辑：图片加载完成后检测比例
            img.onload = function() {
                const ratio = this.naturalWidth / this.naturalHeight;
                // 如果宽高比大于 2，则标记为超宽图，让其跨越两列
                if (ratio > 2) {
                    item.classList.add('wide-span');
                }
            };

            // 点击放大事件
            item.addEventListener('click', () => {
                lightboxImg.src = photo.src;
                lightboxCaption.textContent = photo.title;
                lightbox.classList.add('active');
                document.body.style.overflow = 'hidden'; // 禁止背景滚动
            });

            item.appendChild(img);
            galleryGrid.appendChild(item);
        });

        // 2. 关闭 Lightbox 逻辑
        const closeLightbox = () => {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
            setTimeout(() => { lightboxImg.src = ''; }, 300);
        };

        lightboxClose.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });
    </script>
</body>
</html>
