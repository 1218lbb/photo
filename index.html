<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的摄影作品集 | Photography Portfolio</title>
    <style>
        /* --- 1. 全局暗色风格设置 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #121212; /* 深灰色背景 */
            color: #e0e0e0; /* 浅灰色文字，保护眼睛 */
            line-height: 1.6;
        }
        a { text-decoration: none; color: inherit; transition: color 0.3s ease; }
        a:hover { color: #fff; }

        /* --- 2. 顶部信息栏 --- */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 50px;
            background-color: #1e1e1e; /* 比背景稍亮的导航栏 */
            position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid #333;
        }
        .logo { font-size: 24px; font-weight: bold; letter-spacing: 2px; color: #fff; }
        .nav-links a { margin-left: 30px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #aaa; }
        .nav-links a:hover { color: #fff; }

        /* --- 3. 全屏滚动展览 (Hero Section) --- */
        .hero {
            position: relative; width: 100%; height: 90vh; /* 占满几乎整个屏幕高度 */
            overflow: hidden; background-color: #000;
        }
        .hero-slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; transition: opacity 1.5s ease-in-out;
            background-size: cover; background-position: center;
            display: flex; align-items: flex-end; justify-content: center;
        }
        .hero-slide::before { /* 添加黑色渐变，让文字更清晰 */
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top, rgba(18,18,18,0.8), transparent);
        }
        .hero-slide.active { opacity: 1; }
        .hero-caption {
            position: relative; z-index: 1; padding: 40px; text-align: center;
            color: #fff; max-width: 800px;
        }
        .hero-caption h2 { font-size: 32px; font-weight: 300; letter-spacing: 3px; margin-bottom: 10px; }
        .hero-caption p { font-size: 16px; opacity: 0.8; }

        /* --- 4. 作品网格与放大功能 --- */
        .gallery-section { padding: 80px 50px; max-width: 1400px; margin: 0 auto; }
        .section-title { font-size: 28px; margin-bottom: 40px; text-align: center; letter-spacing: 2px; color: #fff; font-weight: 300; }
        
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        .gallery-item {
            position: relative; overflow: hidden; cursor: pointer;
            background-color: #1e1e1e; aspect-ratio: 3/2; /* 保持图片比例一致 */
        }
        .gallery-item img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.6s ease;
        }
        .gallery-item:hover img { transform: scale(1.08); }
        
        /* 图片遮罩层 */
        .overlay {
            position: absolute; bottom: 0; left: 0; right: 0; padding: 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            transform: translateY(100%); transition: transform 0.3s ease;
        }
        .gallery-item:hover .overlay { transform: translateY(0); }
        .overlay h3 { font-size: 18px; color: #fff; margin-bottom: 5px; font-weight: 400; }
        .overlay p { font-size: 13px; opacity: 0.7; }

        /* --- 5. 图片放大预览 (Lightbox) --- */
        .lightbox {
            display: none; position: fixed; z-index: 1000; padding-top: 50px;
            left: 0; top: 0; width: 100%; height: 100%; overflow: auto;
            background-color: rgba(0, 0, 0, 0.95);
        }
        .lightbox-content {
            margin: auto; display: block; max-width: 90%; max-height: 85vh;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        .lightbox-caption {
            margin: auto; display: block; width: 80%; max-width: 700px;
            text-align: center; color: #ccc; padding: 10px 0; font-size: 16px;
        }
        .close-lightbox {
            position: absolute; top: 20px; right: 35px; color: #f1f1f1;
            font-size: 40px; font-weight: bold; transition: 0.3s; cursor: pointer;
        }
        .close-lightbox:hover { color: #bbb; }

        /* --- 6. 页脚 --- */
        footer {
            text-align: center; padding: 40px; background: #1e1e1e; color: #666;
            font-size: 13px; letter-spacing: 1px; margin-top: 50px; border-top: 1px solid #333;
        }

        /* --- 7. 手机端适配 --- */
        @media (max-width: 768px) {
            nav { padding: 15px 20px; }
            .nav-links a { margin-left: 15px; font-size: 12px; }
            .hero-caption h2 { font-size: 24px; }
            .gallery-section { padding: 40px 20px; }
            .gallery-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- 顶部信息栏 -->
    <nav>
        <div class="logo">MY PORTFOLIO</div>
        <div class="nav-links">
            <a href="about.html">关于</a>
        </div>
    </nav>

    <!-- 全屏滚动展览 -->
    <div class="hero">
        <div class="hero-slide active" style="background-image: url('your-main-photo-1.jpg');">
            <div class="hero-caption">
                <h2>作品标题一</h2>
                <p>这里是作品的简短描述，可以写拍摄地点或背后的故事。</p>
            </div>
        </div>
        <div class="hero-slide" style="background-image: url('your-main-photo-2.jpg');">
            <div class="hero-caption">
                <h2>作品标题二</h2>
                <p>另一张主打作品的描述。</p>
            </div>
        </div>
        <div class="hero-slide" style="background-image: url('your-main-photo-3.jpg');">
            <div class="hero-caption">
                <h2>作品标题三</h2>
                <p>第三张主打作品的描述。</p>
            </div>
        </div>
    </div>

    <!-- 作品网格 -->
    <section class="gallery-section">
        <h2 class="section-title">精选作品</h2>
        <div class="gallery-grid">
            <!-- 作品 1 -->
            <div class="gallery-item">
                <img src="AThousandTowers.jpg" alt="千塔之城" onclick="openLightbox(this)">
                <div class="overlay">
                    <h3>千塔之城</h3>
                    <p>2023 · 风光摄影</p>
                </div>
            </div>
            <!-- 作品 2 -->
            <div class="gallery-item">
                <img src="your-photo-2.jpg" alt="作品标题" onclick="openLightbox(this)">
                <div class="overlay">
                    <h3>作品标题</h3>
                    <p>2023 · 纪实摄影</p>
                </div>
            </div>
            <!-- 作品 3 -->
            <div class="gallery-item">
                <img src="your-photo-3.jpg" alt="作品标题" onclick="openLightbox(this)">
                <div class="overlay">
                    <h3>作品标题</h3>
                    <p>2023 · 人像摄影</p>
                </div>
            </div>
             <!-- 作品 4 -->
             <div class="gallery-item">
                <img src="your-photo-4.jpg" alt="作品标题" onclick="openLightbox(this)">
                <div class="overlay">
                    <h3>作品标题</h3>
                    <p>2023 · 街头摄影</p>
                </div>
            </div>
        </div>
    </section>

    <!-- 图片放大预览 (Lightbox) 的HTML结构 -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="close-lightbox" onclick="closeLightbox()">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
        <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>

    <footer>
        © 2026 My Portfolio. All Rights Reserved.
    </footer>

    <!-- JavaScript 交互逻辑 -->
    <script>
        // --- 1. 全屏滚动逻辑 ---
        let slideIndex = 0;
        const slides = document.querySelectorAll('.hero-slide');
        
        function showSlides() {
            // 隐藏所有幻灯片
            slides.forEach(slide => slide.classList.remove('active'));
            // 更新索引
            slideIndex++;
            if (slideIndex > slides.length) { slideIndex = 1; }
            // 显示当前幻灯片
            slides[slideIndex - 1].classList.add('active');
            // 每5秒切换一次
            setTimeout(showSlides, 5000); 
        }
        // 页面加载完成后启动
        showSlides();

        // --- 2. 图片放大预览逻辑 ---
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCaption = document.getElementById('lightbox-caption');

        function openLightbox(element) {
            lightbox.style.display = "block";
            lightboxImg.src = element.src;
            lightboxCaption.innerHTML = element.alt;
        }

        function closeLightbox() {
            lightbox.style.display = "none";
        }
    </script>
</body>
</html>
