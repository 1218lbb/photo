<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About | T. J. ART</title>
    <style>
        /* --- 1. 全局样式 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #000;
            color: #e0e0e0;
            line-height: 1.8;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        a { text-decoration: none; color: inherit; transition: opacity 0.3s ease; }
        a:hover { opacity: 0.7; }

        /* --- 2. 左上角返回键 --- */
        .back-link {
            position: fixed;
            top: 30px;
            left: 40px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            z-index: 100;
        }

        /* --- 3. 关于页面内容 --- */
        .about-container {
            max-width: 600px;
            text-align: center;
            padding: 40px;
            border: 1px solid #1a1a1a;
            background-color: #050505;
        }
        .about-text {
            font-size: 16px;
            font-weight: 300;
            letter-spacing: 1px;
            color: #ccc;
            margin-bottom: 40px;
            text-align: left;
        }
        .about-text p {
            margin-bottom: 25px;
        }
        .signature {
            font-size: 14px;
            color: #888;
            text-align: right;
            font-style: italic;
            margin-top: 30px;
            border-top: 1px solid #222;
            padding-top: 20px;
        }
        .signature p {
            margin: 5px 0;
        }
        .email-text {
            display: block;
            margin-top: 10px;
            font-size: 13px;
            letter-spacing: 1px;
            color: #aaa;
        }

        /* --- 4. 手机端适配 --- */
        @media (max-width: 768px) {
            .back-link { top: 20px; left: 25px; font-size: 11px; }
            .about-container { padding: 30px 20px; }
            .about-text { font-size: 15px; }
        }
    </style>
</head>
<body>
    <!-- 返回主页，浏览器会自动恢复之前的滚动位置 -->
    <a href="index.html" class="back-link">← BACK</a>

    <div class="about-container">
        <div class="about-text">
            <p>你好，我是一名摄影爱好者，也是一名在读的博士研究生。我通过这个网站向你分享作品，并讲述作品背后的故事。</p>
            <p>我的摄影之旅从2019年开始，如今已经成为了一种生活方式。每当远离城市、走进旷野，随意地开着车，我都感到心旷神怡。我尝试通过镜头表达自己对所及之处的感受，就有了这些图片。</p>
            <p>希望这些图片能带给你一缕旷野的风。</p>
        </div>
        <div class="signature">
            <p>T. J. Wan</p>
            <span class="email-text">wantianjian@163.com</span>
            <p>Sep, 2026.</p>
        </div>
    </div>
</body>
</html>
